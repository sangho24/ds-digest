name: Daily DS Digest

on:
  schedule:
    # UTC 22:10 = KST 07:10
    - cron: '10 22 * * *'
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

# 동시 실행 방지: 수동 실행과 스케줄이 겹치면 git push가 경합해
# 그날치 산출물이 조용히 유실된다 (실측 109일 중 11일 결번).
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 3.14 금지: protobuf C ext, supabase pyiceberg 빌드 실패
          cache: 'pip'

      - name: Install dependencies
        # 실패 케이스 A: supabase>=2.19.0 → pyiceberg 포함 → MSVC 없어 빌드 실패
        #   대응: requirements.txt에 supabase>=2.9.0,<2.19.0 고정
        # 실패 케이스 B: google-generativeai SDK → protobuf C ext 충돌
        #   대응: SDK 미사용, httpx로 REST API 직접 호출
        run: pip install -r requirements.txt

      - name: Run daily digest
        # 실패 케이스 C: YouTube transcript API가 GitHub Actions IP 차단
        #   대응: YOUTUBE_COOKIES secret에 쿠키 파일(Netscape 형식)을 base64 인코딩해서 저장
        #   쿠키 추출 방법: 브라우저에서 youtube.com 로그인 후
        #     "Get cookies.txt LOCALLY" 확장 프로그램으로 내보내기 →
        #     base64 인코딩: python -c "import base64,sys; print(base64.b64encode(open('cookies.txt','rb').read()).decode())"
        #     → 출력값을 GitHub Secrets > YOUTUBE_COOKIES 에 저장
        #   쿠키 미설정 시: 익명 요청으로 fallback (로컬은 보통 통과, Actions는 차단될 수 있음)
        # 실패 케이스 D: 환경변수 누락 → pydantic ValidationError
        #   대응: 아래 env 목록과 GitHub Secrets 등록 목록을 일치시킬 것
        env:
          # AI (Groq가 설정된 경우 Gemini 대신 사용)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 2026-07-17 qwen/qwen3-32b 셧다운으로 교체. Groq 공식 마이그레이션 대상.
          # ⚠️ GROQ_MODEL 시크릿이 설정돼 있으면 그쪽이 우선하므로, 시크릿도 함께 갱신할 것.
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          # 2026-08-16 llama-3.3-70b-versatile 셧다운으로 교체(2026-06-17 공지).
          # 같은 공지에서 llama-3.1-8b-instant도 폐기돼 llama 계열엔 대안이 없다.
          # 랭킹 출력은 strict JSON Schema로 강제하므로 분석과 같은 모델을 쓴다.
          # ⚠️ 이 env가 없으면 시크릿으로 모델을 덮을 수 없어, 폐기 사고 때
          #    코드 배포 없이는 복구가 불가능했다. 그래서 명시적으로 노출한다.
          GROQ_RANKING_MODEL: ${{ secrets.GROQ_RANKING_MODEL || 'openai/gpt-oss-120b' }}
          # Database
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Email
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # App
          BASE_URL: ${{ secrets.BASE_URL }}
          DELIVERY_CHANNELS: ${{ secrets.DELIVERY_CHANNELS }}
          # YouTube 쿠키 (GitHub Actions IP 차단 우회 — 선택사항)
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # Content Sources
          YOUTUBE_CHANNELS: ${{ secrets.YOUTUBE_CHANNELS }}
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          ARXIV_CATEGORIES: ${{ secrets.ARXIV_CATEGORIES || 'cs.LG,stat.ML' }}
          HACKERNEWS_KEYWORDS: ${{ secrets.HACKERNEWS_KEYWORDS || 'machine learning,MLOps,data science,LLM' }}
          HACKERNEWS_MIN_SCORE: ${{ secrets.HACKERNEWS_MIN_SCORE || '50' }}
          # Settings
          MAX_ITEMS_PER_DIGEST: ${{ secrets.MAX_ITEMS_PER_DIGEST }}
          RELEVANCE_THRESHOLD: ${{ secrets.RELEVANCE_THRESHOLD }}
          YT_FETCH_PER_CHANNEL: ${{ secrets.YT_FETCH_PER_CHANNEL }}
          YT_NEW_PER_CHANNEL: ${{ secrets.YT_NEW_PER_CHANNEL }}
          DRY_RUN: "false"
        run: python -m app.jobs.daily_digest

      - name: Publish docs to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/(공개 HTML) + data/records/(구조화 정본 JSON)
          #  + data/quiz_results.jsonl(퀴즈 정답 라벨) 함께 커밋.
          # 라벨은 이 런의 피드백 폴링 단계에서 덧붙여지므로 여기서 잡힌다.
          git add docs/ data/records/
          # 라벨 파일은 아직 응답이 한 건도 없으면 존재하지 않는다.
          # 없는 경로에 git add를 하면 exit 128로 스텝이 죽으므로 조건부로 담는다.
          # `|| true` 필수: Actions 기본 셸이 `bash -e`라, 조건이 거짓이면
          # 이 줄이 exit 1을 내고 스텝 전체가 죽는다.
          [ -f data/quiz_results.jsonl ] && git add data/quiz_results.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -m "docs: digest $(date +%Y-%m-%d)"
          # push 경합 대비 재시도 (원격이 앞서 있으면 rebase 후 재시도)
          for i in 1 2 3; do
            git push && exit 0
            echo "push failed (attempt $i), rebasing..."
            git pull --rebase origin main || true
          done
          echo "::error::docs push failed after 3 attempts"
          exit 1

      # 실행이 실패하면 조용히 넘어가지 않도록 Telegram으로 알린다.
      # (파이프라인 내부 오류는 _send_error_alert가 처리하지만,
      #  의존성 설치 실패·러너 오류 등 파이썬 진입 전 실패는 여기서만 잡힌다)
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>DS Digest 워크플로 실패</b>%0A$(date -u +%Y-%m-%d)%0A${RUN_URL}" >/dev/null || true
