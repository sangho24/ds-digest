# 주간 품질 계측(evals) 자동화.
# 입력: evals/run.py는 정적 스냅샷 evals/data/archive_items.json을 우선 읽고,
#   없으면 커밋된 구조화 정본 data/records/ 에서 파생시킨다(evals/build_items.py).
#   evals/data/ 는 .gitignore 대상이라 CI엔 존재하지 않으므로, CI는 항상 후자로
#   — 즉 매일의 실제 다이제스트 산출물로 — 계측한다.
#   ⚠️ 이 폴백이 없던 2026-07-27~08-24 사이 이 워크플로는 5번 실행해 5번 전부
#      exit 2로 실패했고, 품질 게이트가 한 번도 동작하지 않았다.
# 게이트: run.py가 임계값 위반·회귀 시 exit 1, 입력/파싱 오류 시 exit 2를 반환하므로
#   별도 판정 스텝 없이 이 잡의 성공/실패가 곧 품질 게이트가 된다.
name: Weekly Evals

on:
  schedule:
    # 월요일 00:00 UTC = KST 월요일 09:00
    - cron: '0 0 * * 1'
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

jobs:
  evals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 3.14 금지: protobuf C ext, supabase pyiceberg 빌드 실패
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evals
        # 임계값 위반·baseline 회귀 시 exit 1로 잡이 실패하며, 그것이 품질 게이트다.
        run: python evals/run.py --json --baseline
