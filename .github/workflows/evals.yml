# 주간 품질 계측(evals) 자동화.
# 입력: evals/run.py는 정적 스냅샷 evals/data/archive_items.json을 우선 읽고,
#   없으면 커밋된 구조화 정본 data/records/ 에서 파생시킨다(evals/build_items.py).
#   evals/data/ 는 .gitignore 대상이라 CI엔 존재하지 않으므로, CI는 항상 후자로
#   — 즉 매일의 실제 다이제스트 산출물로 — 계측한다.
#   ⚠️ 이 폴백이 없던 2026-07-27~08-24 사이 이 워크플로는 5번 실행해 5번 전부
#      exit 2로 실패했고, 품질 게이트가 한 번도 동작하지 않았다.
#   ⚠️ 2026-08-31~09-14 실패는 파이프라인이 아니라 비교 기준이 원인이었다. 한 줄 요약
#      평균이 짧아진 것(32.38 → 28.56자, 프롬프트 상한 30자라 개선)을 "짧아지면 회귀"로
#      잡았고, baseline은 수정 전 파이프라인의 정적 스냅샷(임계값 FAIL 8개)이었다.
#      지금은 회귀도 scope·severity를 THRESHOLDS에서 따르고 허용폭을 둔다. 기준점은
#      손으로 고치지 말고 로컬에서 `.venv/bin/python evals/run.py --write-baseline`으로만
#      다시 만든다(FAIL 임계값 위반이나 source_funnel 미계측이면 거부된다). PROGRESS.md §39.
# 게이트: run.py가 FAIL 임계값 위반·FAIL 회귀 시 exit 1, 입력/파싱 오류 시 exit 2를 반환하므로
#   별도 판정 스텝 없이 이 잡의 성공/실패가 곧 품질 게이트가 된다.
name: Weekly Evals

on:
  schedule:
    # 월요일 00:00 UTC = KST 월요일 09:00
    - cron: '0 0 * * 1'
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능
    inputs:
      simulate_failure:
        description: '알림 경로 점검용. 게이트 결과와 무관하게 실패로 끝내 알림을 보낸다'
        type: boolean
        default: false

jobs:
  evals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 3.14 금지: protobuf C ext, supabase pyiceberg 빌드 실패
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evals
        # FAIL 위반·FAIL baseline 회귀 시 exit 1로 잡이 실패하며, 그것이 품질 게이트다.
        # WARN은 보고만 하고 게이트를 떨어뜨리지 않는다 — WARN 하나가 잡을 영구히
        # 빨간불로 묶으면 "실패"가 신호가 아니라 소음이 된다.
        # 리포트를 파일로 남겨 아래 알림 스텝이 읽게 한다.
        #
        # ⚠️ `set -o pipefail` 필수. Actions의 기본 셸은 `bash -e`이고 pipefail이
        #    **꺼져 있어서**, 파이프라인의 종료 코드가 마지막 명령(tee)의 0으로
        #    덮인다. 이게 없으면 run.py가 exit 1을 내도 스텝이 성공으로 잡히고
        #    품질 게이트가 통째로 무력화된다.
        run: |
          set -o pipefail
          python evals/run.py --json --baseline | tee evals_report.json
          # 알림 경로가 살아 있는지 보려면 실제 실패를 기다릴 수밖에 없다.
          # 이 스위치는 수동 실행에서만 켜지며, 리포트는 진짜 값 그대로 둔다.
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "::warning::simulate_failure - 알림 경로 점검을 위해 실패로 끝낸다"
            exit 1
          fi

      # 게이트가 빨간불이면 **무엇이** 문제인지까지 보낸다. GitHub 기본 실패
      # 메일은 "워크플로가 실패했다"만 알려주므로 매주 오면 곧 소음이 된다.
      # 본문 조립은 evals/notify.py가 한다 — YAML 블록 안에 heredoc으로 파이썬을
      # 인라인하면 들여쓰기가 깨져 워크플로 자체가 파싱 불가가 되고, 무엇보다
      # 인라인 스크립트는 테스트할 수 없다.
      - name: Notify quality gate
        if: failure()
        env:
          # 발송 정본 채널(Discord)과 이메일 둘 다로 보낸다. 2026-09-01 발송이
          # Discord 로 옮겨간 뒤에도 이 알림만 Telegram 으로 가고 있었고,
          # 사용자에게 닿은 것은 GitHub 기본 실패 메일뿐이었다.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 전송 결과를 그대로 남긴다. 예전처럼 `|| true` 로 삼키면 "알림이 안 온 것"과
          # "보냈는데 못 받은 것"을 구분할 수 없다.
          python -m evals.alert evals_report.json --run-url "$RUN_URL" || \
            echo "::warning::품질 게이트 알림 전송이 일부 실패했다"
