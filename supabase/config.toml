# Supabase CLI 설정. 이 저장소가 CLI 에 알려 줄 것만 적은 최소 파일이다.
# 적지 않은 항목은 CLI 기본값을 쓴다. 로컬 개발 스택(supabase start)은 쓰지 않는다.

# 같은 컴퓨터의 다른 Supabase 프로젝트와 구분하는 이름이다(공식 문서에 필수 항목으로 나온다).
# 원격 프로젝트 ref 가 아니다. 원격 연결은 supabase link 가 따로 맡는다.
project_id = "ds-digest"

# 두 함수 모두 로그인 없는 사람(구독자, 가입 신청자)과 메일 서버가 호출하는 공개 엔드포인트라
# JWT 검증을 끈다. 인증은 함수 안에서 한다(digest-feedback 은 token, digest-join 은 초대 코드).
[functions.digest-feedback]
verify_jwt = false

[functions.digest-join]
verify_jwt = false
