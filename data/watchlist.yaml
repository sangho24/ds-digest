# 릴리스 추적 워치리스트 (초안 2026-09-03)
#
# 설계 원칙
#   1. 특정 모델 버전을 하드코딩하지 않는다. 조직 + 시리즈 접두사로 감시하면
#      신규 버전이 자동 포착되고, 사람은 조직만 관리하면 된다.
#   2. 매칭은 정확 매칭만 쓴다 (hf org 소속 + series prefix). LLM 추론을 쓰지 않는다.
#      실측에서 정규식 추출 시 "Claude Shannon", "Claude or" 같은 오탐이 나왔다.
#   3. LLM의 역할은 "여기 없는 신규 조직·시리즈 후보 제안"으로만 한정하고,
#      승인은 주간 검수에서 사람이 한다.
#
# verify: W0 프로브에서 확인해야 하는 항목. 확인 전까지 신뢰하지 않는다.
#   - hf_org 이름이 실재하는가
#   - blog 피드가 실제로 RSS/Atom 을 반환하는가

version: 1
updated_at: "2026-09-03"

