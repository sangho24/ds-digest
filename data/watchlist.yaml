# ---------------------------------------------------------------------------
# 추적 대상 상태 전이 (4.2절)
# ---------------------------------------------------------------------------
transitions:
  - announced_at    # 마케팅 블로그 / 공식 발표
  - report_at       # 기술 리포트 또는 논문
  - weights_at      # 가중치 공개 (HF 리포지토리)
  - model_card_at   # 실체 있는 모델 카드
  # license 는 전이가 아니라 속성으로 기록한다

# 신규 후보 제안은 여기에 쌓이고, 주간 검수에서 승인되면 orgs 로 옮긴다
